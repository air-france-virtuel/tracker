# Version de test : fabrique l'installateur SANS rien publier (pas de release, les pilotes ne la reçoivent pas).
# Se lance quand on pousse une branche « test-… ». L'installateur est rangé dans les fichiers du lancement (Actions).
name: Version de test du tracker
on:
  push:
    branches: ['test-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer NSIS
        shell: pwsh
        run: |
          # NSIS déjà présent sur la machine GitHub ? Sinon, le paquet d'electron-builder hébergé sur GitHub
          # (le même que pour les essais locaux), sans dépendre du site Chocolatey.
          if ((Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') -or (Test-Path 'C:\Program Files\NSIS\makensis.exe')) { Write-Host 'NSIS déjà installé'; exit 0 }
          $url = 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z'
          for ($i = 1; $i -le 3; $i++) {
            curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\nsis.7z" $url
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          7z x "$env:RUNNER_TEMP\nsis.7z" "-o$env:RUNNER_TEMP\nsis" -y | Out-Null
          $exe = "$env:RUNNER_TEMP\nsis\Bin\makensis.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:RUNNER_TEMP\nsis\makensis.exe" }
          if (-not (Test-Path $exe)) { Write-Error 'makensis introuvable'; exit 1 }
          "MAKENSIS=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe -VERSION
      - name: Installer les dépendances
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Tests du moteur de vol
        run: npm test
      - name: Fabriquer l'appli et l'installateur
        run: npm run dist
      - name: Garder l'installateur (pas de publication)
        uses: actions/upload-artifact@v4
        with:
          name: tracker-version-test
          path: dist/LesAilesTricolores-Tracker-Setup-*.exe
          retention-days: 7
