<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>AFV Tracker – panneau compact</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0A1E4A;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1E3A78}
.h b{font-size:16px}.h .r{color:#8FA3D3;font-size:13px}
.ph{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:#C8102E;padding:3px 7px;border-radius:4px}
.pin{border:1px solid #2C4A8C;background:none;color:#C9D4EE;border-radius:6px;font:inherit;font-size:11px;padding:4px 7px;cursor:pointer}
.pin[aria-pressed="true"]{background:#1E3A78;color:#fff}
.pg{height:4px;background:#1E3A78}.pg i{display:block;height:4px;background:#F0374E;width:0}
.big{padding:12px 14px;border-bottom:1px solid #1E3A78}
.k{font-size:10.5px;letter-spacing:.12em;color:#8FA3D3;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.n{font-size:32px;font-weight:800;line-height:1.1}.n.y{color:#FFD45C}
.sub{font-size:12.5px;color:#C9D4EE}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#1E3A78}.g div{background:#0A1E4A;padding:9px 12px}.g .v{font-size:19px;font-weight:700}
#map{flex:1;min-height:150px;display:block;width:100%}
.chk{margin:10px 14px 8px;background:#0F2A61;border-radius:10px;padding:10px 12px}
.chk ul{margin:6px 0 0;padding:0}.chk li{list-style:none}
.chk button{display:flex;gap:9px;align-items:flex-start;width:100%;background:none;border:none;color:#fff;font:inherit;font-size:13px;text-align:left;padding:5px 0;cursor:pointer}
.box{width:16px;height:16px;border-radius:4px;border:2px solid #8FA3D3;flex-shrink:0;margin-top:1px}
button[aria-pressed="true"] .box{background:#3DDC84;border-color:#3DDC84}
.max{display:flex;gap:10px;align-items:flex-start;padding:0 14px 12px}
.max .a{width:30px;height:30px;border-radius:15px;background:#F0374E;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.max div{font-size:12.5px;line-height:1.45;color:#DCE4F5}
</style>
</head>
<body>
<div class="h"><svg width="30" height="30" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="afvg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16346F"/><stop offset="1" stop-color="#0A1E4A"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#afvg)"/><g transform="translate(0 2)"><path d="M15 62 L25.5 34 L36 62" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="miter"/><path d="M44.5 62 V34 H60 M44.5 48 H56.5" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="miter"/><path d="M64 34 L74.5 62 L85 34" fill="none" stroke="#F0374E" stroke-width="7" stroke-linejoin="miter"/><path d="M13 75 C 38 69, 62 67, 88 70 L 88 72.4 C 62 70.4, 38 72, 13 77.2 Z" fill="#F0374E"/></g></svg><div><b id="cs">AFV</b> <span class="r" id="rt"></span></div><span class="ph" id="ph" hidden></span><button class="pin" id="pin" aria-pressed="true" title="Garder au-dessus du simulateur">Épinglé</button></div>
<div class="pg"><i id="pg"></i></div>
<div class="big"><div class="k" id="evK">PROCHAIN ÉVÉNEMENT</div><div class="row"><span class="n y" id="evL">PRÊT</span><span class="n" id="evV"></span></div><div class="sub" id="evS">Démarre le suivi dans le tracker.</div></div>
<div class="g" id="params"></div>
<svg id="map" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mini-carte du vol"></svg>
<div class="chk"><div class="k" id="chkT">CHECK-LIST</div><ul id="chk"></ul></div>
<div class="max"><span class="a">M</span><div id="max"><b>Max :</b> prêt quand tu l’es.</div></div>
<script src="monde.js"></script>
<script src="maplayers.js"></script>
<script src="compact.js"></script>
</body>
</html>
