<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Max – copilote</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;user-select:none}
.win{position:absolute;inset:6px;display:flex;flex-direction:column;background:rgba(8,24,56,.93);border:1px solid rgba(143,163,211,.35);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
body.mini .win{bottom:auto}
.h{display:flex;align-items:center;gap:10px;padding:10px 12px;-webkit-app-region:drag;border-bottom:1px solid rgba(143,163,211,.2)}
.h .t{min-width:0;flex:1}.h b{font-size:14px;display:block}.h span{font-size:11.5px;color:#9FB2DD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ph{flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;background:#C8102E;padding:3px 7px;border-radius:4px;white-space:nowrap}
.bt{-webkit-app-region:no-drag;display:flex;gap:4px}
.bt button{width:26px;height:26px;border-radius:7px;border:0;background:rgba(255,255,255,.08);color:#C9D4EE;cursor:pointer;font:inherit;font-size:13px;line-height:1}
.bt button:hover{background:rgba(255,255,255,.18);color:#fff}
.bt button[aria-pressed="true"]{background:#C8102E;color:#fff}
.say{display:flex;gap:10px;padding:12px 12px 10px}
.say .a{flex:none}
.bub{background:#fff;color:#0A1E4A;border-radius:4px 14px 14px 14px;padding:9px 11px;font-size:13.5px;line-height:1.4;font-weight:500}
.hist{padding:0 14px 6px;font-size:11.5px;color:#9FB2DD;line-height:1.35}
.hist div{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{margin:4px 10px 10px;background:rgba(255,255,255,.06);border-radius:12px;padding:9px 11px;flex:1;min-height:0;overflow:auto}
.ck .k{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.1em;color:#9FB2DD;font-weight:800}
.ck .k i{font-style:normal;letter-spacing:0;font-weight:700;color:#C9D4EE}
.ck ul{margin:6px 0 0;padding:0}.ck li{list-style:none}
.ck button{display:flex;gap:9px;align-items:flex-start;width:100%;background:none;border:none;color:#fff;font:inherit;font-size:13px;text-align:left;padding:5px 0;cursor:pointer}
.box{width:17px;height:17px;border-radius:5px;border:2px solid #8FA3D3;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#0A1E4A}
button.on .box{background:#3DDC84;border-color:#3DDC84}
button.on .box::after{content:"✓"}
button.on .tx{color:#9FB2DD;text-decoration:line-through;text-decoration-color:rgba(159,178,221,.5)}
.hp{display:block;font-size:11px;line-height:1.35;color:#9FB2DD;margin-top:2px;font-weight:400}
.sim{display:inline-block;text-decoration:none;font-size:10px;color:#3DDC84;font-weight:700;margin-left:6px;white-space:nowrap}
.done{margin-top:6px;font-size:12.5px;font-weight:700;color:#3DDC84}
body.mini .hist,body.mini .ck,body.mini .ask{display:none}
.ask{display:flex;gap:6px;margin:0 10px 6px;-webkit-app-region:no-drag}
.ask input{flex:1;min-width:0;height:32px;border-radius:9px;border:1px solid rgba(143,163,211,.4);background:rgba(255,255,255,.08);color:#fff;padding:0 10px;font:inherit;font-size:13px;user-select:text}
.ask input::placeholder{color:#8FA3D3}
.ask button{width:34px;border:0;border-radius:9px;background:#C8102E;color:#fff;cursor:pointer;font-size:13px}
.blink{animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.talk .bub{box-shadow:0 0 0 2px #F0374E}
</style>
</head>
<body>
<div class="win">
  <div class="h"><svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#C8102E"/><rect x="11" y="15" width="22" height="13" rx="6" fill="#fff"/><circle class="blink" cx="17" cy="21" r="2.4" fill="#0A1E4A"/><circle class="blink" cx="27" cy="21" r="2.4" fill="#0A1E4A"/><path d="M17 32 q5 3 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <div class="t"><b>Max · ton copilote</b><span id="rt">Prêt quand tu l’es</span></div>
    <span class="ph" id="ph" hidden></span>
    <div class="bt"><button id="mute" title="Couper la voix de Max" aria-pressed="false">🔈</button><button id="mini" title="Réduire / agrandir" aria-pressed="false">▁</button><button id="close" title="Fermer (Max reste dans le tracker)">✕</button></div>
  </div>
  <div class="say" id="say"><div class="bub" id="msg">Salut commandant ! Je reste par-dessus le simulateur pendant tout le vol.</div></div>
  <div class="hist" id="hist"></div>
  <form class="ask" id="ask" autocomplete="off"><input id="askIn" maxlength="160" placeholder="Demande à Max : temps restant, carburant, météo…" aria-label="Question à Max"><button type="submit" aria-label="Envoyer">➤</button></form>
  <div class="ck"><div class="k"><span id="ckT">CHECK-LIST</span><i id="ckN"></i></div><ul id="ck"></ul><div class="done" id="ckDone" hidden>✓ Check-list terminée</div></div>
</div>
<script src="max.js"></script>
</body>
</html>
