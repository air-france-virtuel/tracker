# Fabrique l'installateur sur GitHub et publie la version (bêta).
# Se lance quand on pousse un tag « v0.1.0-beta », ou à la main (onglet Actions).
name: Publier une version du tracker
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer NSIS
        shell: pwsh
        run: |
          # NSIS déjà présent sur la machine GitHub ? Sinon, le paquet d'electron-builder hébergé sur GitHub
          # (le même que pour les essais locaux), sans dépendre du site Chocolatey.
          if ((Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') -or (Test-Path 'C:\Program Files\NSIS\makensis.exe')) { Write-Host 'NSIS déjà installé'; exit 0 }
          $url = 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z'
          for ($i = 1; $i -le 3; $i++) {
            curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\nsis.7z" $url
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 20
          }
          7z x "$env:RUNNER_TEMP\nsis.7z" "-o$env:RUNNER_TEMP\nsis" -y | Out-Null
          $exe = "$env:RUNNER_TEMP\nsis\Bin\makensis.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:RUNNER_TEMP\nsis\makensis.exe" }
          if (-not (Test-Path $exe)) { Write-Error 'makensis introuvable'; exit 1 }
          "MAKENSIS=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe -VERSION
      - name: Installer les dépendances
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Tests du moteur de vol
        run: npm test
      - name: Fabriquer l'appli et l'installateur
        run: npm run dist
      - name: Publier la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          node build-res/release-notes.js > notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La release v$V existe déjà : rien à publier."
            exit 0
          fi
          # Brouillon d'abord : les trackeurs ne voient la version qu'une fois tous les fichiers envoyés.
          # Copie au nom fixe : le lien « releases/latest/download/AirFranceVirtuel-Tracker-Setup.exe »
          # télécharge toujours la dernière version, sans passer par la page GitHub.
          cp "dist/AirFranceVirtuel-Tracker-Setup-$V.exe" dist/AirFranceVirtuel-Tracker-Setup.exe
          gh release create "v$V" --draft --title "Version $V" --notes-file notes.md \
            "dist/AirFranceVirtuel-Tracker-Setup-$V.exe" dist/AirFranceVirtuel-Tracker-Setup.exe dist/latest.yml dist/beta.yml
          gh release edit "v$V" --draft=false --latest
